[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "star-sort"
version = "1.0.0"
description = "Unsupervised grouping of stars into types from their physical measurements"
readme = "README.md"
license = "MIT"
authors = [{ name = "Cristian Gil Sanz" }, { name = "Paola Herráez Bravo" }]
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.5", "pandas>=2.2", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
star-sort = "starsort.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
starsort = ["data/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
